  <circle cx="64" cy="60" r="6" fill="url(#premiere)"/>
  <!-- Sprocket holes -->
  <circle cx="64" cy="28" r="3.2" fill="#0b1c33"/>
  <circle cx="92" cy="44" r="3.2" fill="#0b1c33"/>
  <circle cx="92" cy="76" r="3.2" fill="#0b1c33"/>
  <circle cx="64" cy="92" r="3.2" fill="#0b1c33"/>
  <circle cx="36" cy="76" r="3.2" fill="#0b1c33"/>
  <circle cx="36" cy="44" r="3.2" fill="#0b1c33"/>

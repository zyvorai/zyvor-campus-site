<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Zyvor Campus">
  <defs>
    <linearGradient id="premiere" x1="8" y1="12" x2="120" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="32%" stop-color="#f5a524"/>
      <stop offset="62%" stop-color="#0dbf8a"/>
      <stop offset="100%" stop-color="#3558f5"/>
    </linearGradient>
    <linearGradient id="glow" x1="40" y1="28" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8f1" stop-opacity=".95"/>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:400;src:url(../fonts/inter-400.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/inter-600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../fonts/inter-700.woff2)}
:root{--bg:#000;--surface:#1d1d1f;--text:#f5f5f7;--muted:#86868b;--accent:#2997ff}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:var(--text);
background:radial-gradient(ellipse at 70% 0%,rgba(255,255,255,.04),transparent 60%),linear-gradient(180deg,#000,#1d1d1f);position:relative}
.z{position:absolute;left:80px;top:72px;width:72px;height:72px;border-radius:18px;background:var(--surface);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.eyebrow{position:absolute;left:176px;top:94px;font-size:26px;font-weight:600;color:var(--muted);letter-spacing:.02em}
h1{position:absolute;left:80px;top:230px;margin:0;font-size:92px;line-height:1.04;letter-spacing:-.03em;font-weight:700}
h1 em{font-style:normal;color:var(--accent)}
p{position:absolute;left:80px;bottom:72px;margin:0;font-size:28px;color:var(--muted)}
</style></head><body>
<div class="z"><svg viewBox="0 0 64 64" width="40" height="40"><path d="M16 16h32L22 48h26" fill="none" stroke="#f5f5f7" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
<div class="eyebrow">Zyvor Campus</div>
<h1>Your semester.<br><em>Rated remarkable.</em></h1>
<p>Self-hosted by Zyvor AI Labs.</p>
</body></html>
